services:
  postgres:
    image: postgres:17-alpine
    container_name: invismail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invismail
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: invismail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invismail"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: invismail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invismail-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://invismail:${DB_PASSWORD}@postgres:5432/invismail
      REDIS_URL: redis://redis:6379/0
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-invismail.test}
      MAX_EMAIL_SIZE_BYTES: ${MAX_EMAIL_SIZE_BYTES:-10485760}
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-5242880}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  smtp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invismail-smtp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.smtp.server"]
    environment:
      DATABASE_URL: postgresql+asyncpg://invismail:${DB_PASSWORD}@postgres:5432/invismail
      REDIS_URL: redis://redis:6379/0
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-invismail.test}
      MAX_EMAIL_SIZE_BYTES: ${MAX_EMAIL_SIZE_BYTES:-10485760}
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-5242880}
    ports:
      - "127.0.0.1:2525:2525"
    volumes:
      - ./storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invismail-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.email_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://invismail:${DB_PASSWORD}@postgres:5432/invismail
      REDIS_URL: redis://redis:6379/0
      SPOOL_DLQ_RETENTION_SECONDS: ${SPOOL_DLQ_RETENTION_SECONDS:-3600}
      SPOOL_ORPHAN_GRACE_SECONDS: ${SPOOL_ORPHAN_GRACE_SECONDS:-3600}
    volumes:
      - ./storage:/app/storage

  cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invismail-cleanup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.cleanup_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://invismail:${DB_PASSWORD}@postgres:5432/invismail
      REDIS_URL: redis://redis:6379/0
      SPOOL_DLQ_RETENTION_SECONDS: ${SPOOL_DLQ_RETENTION_SECONDS:-3600}
      SPOOL_ORPHAN_GRACE_SECONDS: ${SPOOL_ORPHAN_GRACE_SECONDS:-3600}
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
  redis_data:
